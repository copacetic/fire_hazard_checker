# Rebuilds dashboard-ratings.json from CDE's public research files so the
# site's inline CA School Dashboard ratings stay current. The Dashboard
# updates once a year (December), so monthly is generous.
name: Refresh CA Dashboard ratings data
on:
  schedule:
    - cron: "17 9 3 * *"
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-dashboard-data.mjs
      - name: Commit if changed
        run: |
          if ! git diff --quiet dashboard-ratings.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add dashboard-ratings.json
            git commit -m "Refresh CA Dashboard ratings data"
            git push
          fi
